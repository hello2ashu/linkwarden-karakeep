services:
  # Old standalone "postgres" service removed — Linkwarden now uses the
  # shared_postgres container from deploy-shared-postgres.yaml.
  # Requires: CREATE DATABASE linkwarden OWNER linkwardenuser; in that stack's init.sql,
  # and the "shared-postgres_net" external network below.

  linkwarden:
    environment:
      - NEXTAUTH_URL=https://linkwarden.ashish-syn-nas.synology.me
      - NEXTAUTH_URL_INTERNAL=http://localhost:3000
      - NEXTAUTH_SECRET=${linkwardennextauth}
      - DATABASE_URL=postgres://linkwardenuser:${sharedpgadminpass}@Shared-Postgres:5432/linkwarden
      - POSTGRES_DB=linkwarden
      - POSTGRES_USER=linkwardenuser
      - POSTGRES_PASSWORD=${sharedpgadminpass}
      - MEILI_MASTER_KEY=${sharedmeilisearch}
      - MEILI_HOST=http://meilisearch:7700
    restart: always
    image: ghcr.io/linkwarden/linkwarden:latest
    ports:
      - 3101:3000
    volumes:
      - /volume1/docker/linkwarden/data:/data/data
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      - meilisearch
    networks:
      - default
      - shared-postgres_net

  web:
    image: ghcr.io/karakeep-app/karakeep:latest
    restart: unless-stopped
    volumes:
      - /volume1/docker/karakeep/data:/data
    ports:
      - 3000:3000
    environment:
      - NEXTAUTH_SECRET=${karanextauth}
      - MEILI_MASTER_KEY=${sharedmeilisearch}
      - NEXTAUTH_URL=http://192.168.189.40:3000
      - MEILI_ADDR=http://meilisearch:7700
      - BROWSER_WEB_URL=http://chrome:9222
      - DATA_DIR=/data
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      - meilisearch
      - chrome

  chrome:
    image: zenika/alpine-chrome:latest
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: meilisearch
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${sharedmeilisearch}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - /volume1/docker/meilisearch/meili_data:/meili_data
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  meilisearch-watchdog:
    image: ghcr.io/hello2ashu/meilisearch-watchdog:latest
    container_name: meilisearch-watchdog
    restart: unless-stopped
    environment:
      DOCKHAND_URL: https://dockhand.ashish-syn-nas.synology.me
      DOCKHAND_ENVIRONMENT_ID: "1"
      DOCKHAND_TOKEN: ${DOCKHAND_TOKEN}                    # generate in Dockhand: Settings > API Tokens
      MEILISEARCH_CONTAINER: meilisearch
      MEILI_DATA_PATH: /meili_data                         # matches the volume mount below
      KARAKEEP_URL: https://karakeep.ashish-syn-nas.synology.me
      KARAKEEP_ADMIN_API_KEY: ${KARAKEEP_ADMIN_API_KEY}    # an admin-role key from Karakeep Settings > API Keys
      LINKWARDEN_DB_HOST: shared_postgres
      LINKWARDEN_DB_NAME: linkwarden
      LINKWARDEN_DB_USER: linkwardenuser
      LINKWARDEN_DB_PASSWORD: ${sharedpgadminpass}
      CHECK_INTERVAL_SECS: "300"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /volume1/docker/meilisearch/meili_data:/meili_data
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      - meilisearch
    networks:
      - default
      - shared-postgres_net

networks:
  shared-postgres_net:
    external: true
